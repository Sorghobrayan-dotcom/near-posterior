[project]
name = "near-posterior"
version = "0.1.0"
description = "A NEAR investment thesis that pools the other theses as evidence and updates a probability daily."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/near_posterior"]
