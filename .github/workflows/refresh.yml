name: refresh

# Daily: refetch the NEAR snapshot only (the reference panel stays frozen), then
# `near_posterior.refresh --commit`: build, verify --write (must pass), git add -A, commit if
# anything changed, a plain verify on the committed tree, and an empty `git status`. Push only
# if that step and the tests on the refreshed snapshot succeed.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m near_posterior.fetch
      - name: build, verify, commit, verify again
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python -m near_posterior.refresh --commit
      - name: tests on the refreshed snapshot (no push if one fails)
        run: uv run pytest -q
      - name: push
        run: git push
