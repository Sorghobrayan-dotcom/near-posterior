name: refresh

# Daily: refetch the NEAR snapshot only (the reference panel stays frozen), rebuild, commit.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m near_posterior.fetch
      - run: uv run python -m near_posterior.build
      - run: uv run python -m near_posterior.verify
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw results THESIS.md README.md site history.csv data/refclass/excluded.csv
          git diff --cached --quiet || git commit -m "chore(data): daily NEAR snapshot refresh"
          git push
