name: pages

# Publish the static page on every push to main. Works once the repository is public and
# GitHub Pages is set to "GitHub Actions". The deploy job runs only when the repository
# variable PAGES_ENABLED is "true": the author sets it (Settings > Secrets and variables >
# Actions > Variables) after enabling Pages, so a private repository gets no red mark.
# The whole repository is published so that the relative links of site/index.html
# (../THESIS.md, ../PREREG.md) resolve; the page is at /near-posterior/site/ and the root
# index.html redirects there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
